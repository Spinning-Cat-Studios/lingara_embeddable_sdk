[package]
name = "lingara-embed-ek-harness"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "The EK conformance harness on lingara-embed's Rust surface: drives every EK case's host script through Embed"

[[bin]]
name = "lingara-embed-ek-harness"
path = "src/main.rs"

[dependencies]
lingara-embed = { path = "..", features = ["schema"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
schemars = "1"
toml = "0.8"
