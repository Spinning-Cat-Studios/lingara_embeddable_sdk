# The repo-root Gradle build's properties (ADR 1.10.26ae D10).
#
# AGP 9 compiles Kotlin itself by default, through the Kotlin Gradle plugin
# on the build's classpath. That plugin is the catalogue's 2.4.10 here, which
# build-logic puts on the root classloader for every JVM project, and AGP
# 9.4's built-in Kotlin cannot drive it ("Could not generate a decorated class
# for type KotlinAndroidTarget"). natives-android, the only Android project in
# this build, holds no Kotlin, so built-in Kotlin is off.
android.builtInKotlin=false

# AGP and the Kotlin Gradle plugin in one daemon outgrow Gradle's default
# 384 MB metaspace.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
