name: Release

# One file, two behaviours (ADR 1.10.26ag D4, the clients' 29.9.26v D4
# repeated). It ships to staging and to the public repository alike.
# Everything before the publish jobs runs in both, so staging's run is the dry
# run and public repeats it before it publishes. The publish jobs run only in
# the public repository, and only for a registry languages.toml names.
#
# The natives are built once per platform (tools/release/release.toml, D3)
# and checked inside every package that carries them before anything is
# published. No registry credential exists outside the public repository's
# `release` environment: crates.io, npm, NuGet and RubyGems mint a short-lived
# token through OIDC; Maven Central and the PHP mirror read the environment's
# secrets; the Godot Asset Library and Fab have no publish API, so their jobs
# write a person's checklist.
#
# release-manifest is installed from the public lingara_api_clients
# repository at the tag make/release.mk pins, never copied here (D2). Every
# `make` below names a target make/release.mk defines.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      registries: ${{ steps.matrix.outputs.registries }}
      natives: ${{ steps.natives.outputs.natives }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make release-manifest-install RELEASE_MANIFEST_ROOT="$RUNNER_TEMP/rm"
      - name: languages.toml agrees with the tree, and the tag may be released
        run: |
          "$RUNNER_TEMP/rm/bin/release-manifest" check
          "$RUNNER_TEMP/rm/bin/release-manifest" check-tag "$TAG"
      - id: matrix
        run: '"$RUNNER_TEMP/rm/bin/release-manifest" matrix "$TAG" | tee -a "$GITHUB_OUTPUT"'
      - id: natives
        run: echo "natives=$(bash tools/release/release-toml.sh matrix)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/rm/bin/release-manifest

  # D3: every [[native]] of release.toml, once per platform, on that
  # platform's runner (linux-x64 inside manylinux_2_28). Each leg checks every
  # library's architecture and, on the desktop legs, that it reports VERSION,
  # then uploads natives-<rid> for the packing legs and the C ABI's zip.
  natives:
    name: natives-${{ matrix.rid }}
    needs: manifest
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.natives) }}
    env:
      RID: ${{ matrix.rid }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # release-toml.sh reads release.toml with tomllib (3.11+); ubuntu-22.04's
      # python3 is 3.10, which left the linux-x64 and android-arm64 legs
      # building nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: targets
        run: |
          case "$RID" in
            win-x64) echo "targets=x86_64-pc-windows-msvc" ;;
            osx) echo "targets=aarch64-apple-darwin,x86_64-apple-darwin" ;;
            android-arm64) echo "targets=aarch64-linux-android" ;;
            ios-arm64) echo "targets=aarch64-apple-ios" ;;
            *) echo "targets=" ;;
          esac >> "$GITHUB_OUTPUT"
      # linux-x64 builds inside its container, which installs its own.
      - if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.targets.outputs.targets }}
      # K4's crate builds on gdext's toolchain (make/godot.mk's GODOT_TOOLCHAIN).
      - if: matrix.container == ''
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ steps.targets.outputs.targets }}
      - if: matrix.container == ''
        run: rustup default stable
      - if: matrix.container == ''
        uses: Swatinem/rust-cache@v2
        with:
          key: release-natives-${{ matrix.rid }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.rid == 'win-x64'
      # bash puts Git's /usr/bin first, whose coreutils `link` shadows
      # MSVC's link.exe for rustc and cl alike.
      - name: MSVC's link.exe, not Git's
        if: matrix.rid == 'win-x64'
        shell: bash
        run: rm -f /usr/bin/link.exe
      - if: matrix.rid == 'android-arm64'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - if: matrix.rid == 'android-arm64'
        run: |
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "OBJDUMP=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump" >> "$GITHUB_ENV"

      - name: Build every native of release.toml for this platform
        run: make release-natives RID="$RID"
      - name: Each library's architecture and format
        run: bash tools/release/check-package.sh arch . "$RID"
      - name: Each desktop library reports VERSION
        run: bash tools/release/version-check.sh "$RID"
      - name: The C ABI's release zip
        run: make release-ffi-zip RID="$RID" TAG="$TAG"

      - id: outs
        run: |
          {
            echo 'paths<<EOF'
            bash tools/release/release-toml.sh outs "$RID"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.rid }}
          path: ${{ steps.outs.outputs.paths }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: artefact-ffi-${{ matrix.rid }}
          path: dist/release/lingara-embed-ffi-${{ github.ref_name }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  conformance-server:
    name: Conformance server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p lingara-embed-conformance-server
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-server
          path: target/release/conformance-server

  # One leg per languages.toml entry: the kit's own targets, its conformance
  # tiers at the tagged commit, then its pack. A package with natives inside is
  # packed from the natives-<rid> bytes D3 checked, and check-package.sh holds
  # it to release.toml before the rename, so no Release and no registry ever
  # receives a package with a platform absent.
  build:
    name: build-${{ matrix.id }}
    needs: [manifest, natives, conformance-server]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    env:
      ID: ${{ matrix.id }}
      PACKS_NATIVES: ${{ contains(fromJSON('["dotnet", "godot", "nativesdesktop", "nativesandroid", "unreal"]'), matrix.id) }}
      # No leg runs a debugger, and debuginfo is most of a debug build's
      # bytes; line tables keep a panic's backtrace readable. The packs build
      # under release profiles, which this does not touch.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # A Bevy debug build fills ubuntu-latest's ~14 GB free, and this leg runs
      # test, clippy (the demo's full renderer included) and conformance in one
      # job: staging run 38311329445's build-bevy stopped on ENOSPC. Drop the
      # preinstalled SDKs it never touches (~25 GB), as ci.yml's bevy job does.
      - name: Free the runner's disk
        if: matrix.id == 'bevy'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '{release-manifest,conformance-server}'
          merge-multiple: true
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP"/bin/* && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - if: env.PACKS_NATIVES == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: ${{ runner.temp }}/natives

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: contains(fromJSON('["core", "bevy", "godot"]'), matrix.id)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.id == 'core' && '1.87' || '1.98.1' }}
          components: clippy
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-build-${{ matrix.id }}
      - if: matrix.id == 'bevy'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - if: matrix.id == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: contains(fromJSON('["kotlin", "java", "nativesdesktop", "nativesandroid", "kotlinserver", "javaserver"]'), matrix.id)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: contains(fromJSON('["dotnet", "dotnetserver"]'), matrix.id)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - if: matrix.id == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - if: matrix.id == 'go'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - if: matrix.id == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - if: matrix.id == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - if: matrix.id == 'godot'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.id == 'godot'
        run: pip install "gdtoolkit==4.*"

      # The natives artefacts' own bytes, laid over the checkout. The natives
      # entries' build is check-jvm-shape, so they are placed first; every
      # other packing leg places them after its tests, which build a host
      # library of their own into the same directories.
      - if: env.PACKS_NATIVES == 'true' && startsWith(matrix.id, 'natives')
        run: cp -R "$RUNNER_TEMP/natives/." .
      - name: The kit's checks and tests (RELEASE_BUILD_<id>)
        env:
          GOTOOLCHAIN: local
        run: make release-build ID="$ID"
      - name: Conformance at the tagged commit (RELEASE_TIER_<id>)
        env:
          GOTOOLCHAIN: local
        run: make release-conformance ID="$ID" CONFORMANCE_SERVER="$RUNNER_TEMP/bin/conformance-server"
      - if: env.PACKS_NATIVES == 'true' && !startsWith(matrix.id, 'natives')
        run: |
          rm -rf godot/addon/addons/lingara/bin/*/ dist/ffi dist/jvm
          cp -R "$RUNNER_TEMP/natives/." .

      # The pack, check-package where natives are inside, then the name on the
      # Release. A tool that changes its naming fails here rather than
      # uploading nothing.
      - name: Pack (RELEASE_PACK_<id>), check-package, rename built → uploaded
        run: |
          make release-pack ID="$ID"
          [ -n "${{ matrix.built }}" ] || exit 0
          read -r built uploaded <<EOF
          $(release-manifest artefact "$ID" "$TAG")
          EOF
          test -f "$built" || { echo "✗ $built was not written"; exit 1; }
          mkdir -p "$RUNNER_TEMP/artefact"
          mv "$built" "$RUNNER_TEMP/artefact/$uploaded"
      - if: matrix.built != ''
        uses: actions/upload-artifact@v4
        with:
          name: artefact-${{ matrix.id }}
          path: ${{ runner.temp }}/artefact/${{ matrix.uploaded }}

  # What each registry will receive, checked with no credential: staging's
  # whole rehearsal, and public's last check before it publishes.
  dry-run:
    name: dry-run-${{ matrix.id }}
    needs: [manifest, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    env:
      ID: ${{ matrix.id }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.registry == 'packagist' && '0' || '1' }}
      - if: matrix.built != ''
        uses: actions/download-artifact@v4
        with:
          name: artefact-${{ matrix.id }}
          path: ${{ runner.temp }}/artefact

      - if: matrix.registry == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.registry == 'npm'
        run: npm publish --dry-run --tag next "$RUNNER_TEMP/artefact/${{ matrix.uploaded }}"

      # Multi-package (Cargo >= 1.90), so bevy_lingara packages against the
      # unpublished core.
      - if: matrix.registry == 'crates.io'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - if: matrix.registry == 'crates.io'
        run: cargo +1.98.1 publish --dry-run --locked -p lingara-embed -p bevy_lingara

      # K3 AC22 and V1 AC31: the package-shape tests, the player's over the
      # Release's own .nupkg.
      - if: matrix.registry == 'nuget'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - if: matrix.id == 'dotnet'
        run: |
          LINGARA_EMBED_NUPKG="$RUNNER_TEMP/artefact/${{ matrix.uploaded }}" \
            dotnet test -c Release --nologo --filter "FullyQualifiedName~PackageShapeTests" \
            dotnet/tests/Lingara.Embed.Tests/Lingara.Embed.Tests.csproj
      - if: matrix.id == 'dotnetserver'
        run: |
          dotnet test -c Release --nologo --filter "FullyQualifiedName~PackageShapeTests" \
            dotnet/tests/Lingara.Embed.Server.Tests/Lingara.Embed.Server.Tests.csproj
          unzip -Z1 "$RUNNER_TEMP/artefact/${{ matrix.uploaded }}" | grep -qx 'lib/net8.0/Lingara.Embed.Server.dll'

      - if: matrix.registry == 'rubygems'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - if: matrix.registry == 'rubygems'
        run: cd ruby && gem build lingara-embed.gemspec

      - if: matrix.registry == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - if: matrix.registry == 'go'
        env:
          GOTOOLCHAIN: local
        run: cd go && go vet ./... && go test ./... && go mod verify

      - if: matrix.registry == 'packagist'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - if: matrix.registry == 'packagist'
        name: composer validate, and the split has composer.json at its root
        run: |
          (cd php && composer validate --strict)
          split=$(git subtree split --prefix=php HEAD)
          git cat-file -e "$split:composer.json" || { echo "✗ the split has no root composer.json"; exit 1; }

      # Sign with a key made here, publish to the file repository, and check
      # what Central requires. The real key never leaves `release`. The AAR's
      # main file is .aar; every other coordinate's is .jar.
      - if: matrix.registry == 'maven-central'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: startsWith(matrix.id, 'natives')
        uses: actions/download-artifact@v4
        with:
          pattern: natives-{win-x64,osx,linux-x64,android-arm64}
          merge-multiple: true
          path: .
      - if: matrix.registry == 'maven-central'
        name: Sign with an ephemeral key and check the file repository
        env:
          PROJECT: ${{ matrix.dir }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --pinentry-mode loopback --passphrase 'dry-run' \
            --quick-gen-key 'Lingara dry run <dry-run@getlingara.com>' rsa4096 sign 1d
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --armor --pinentry-mode loopback --passphrase 'dry-run' --export-secret-keys)"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword='dry-run'
          ./gradlew ":$PROJECT:publishAllPublicationsToStagingRepository"
          artifact="${PACKAGE#*:}"
          version="${TAG#v}"
          main=.jar; [ "$ID" = nativesandroid ] && main=.aar
          dir="build/staging-repo/$(echo "${PACKAGE%%:*}" | tr . /)/$artifact/$version"
          for suffix in "$main" -sources.jar -javadoc.jar .pom; do
            file="$dir/$artifact-$version$suffix"
            for companion in "" .asc .md5 .sha1; do
              test -f "$file$companion" || { echo "✗ missing $file$companion"; exit 1; }
            done
            gpg --batch --verify "$file.asc" "$file"
          done

      # A store has no dry run: its zip passed check-package on its build leg,
      # and the listing text is what a person submits (W4).
      - if: matrix.manual
        run: |
          case "$ID" in
            godot) test -f godot/addon/ASSETLIB.md || { echo "✗ godot/addon/ASSETLIB.md is missing"; exit 1; } ;;
            unreal) test -f unreal/engine-versions.txt || { echo "✗ unreal/engine-versions.txt is missing"; exit 1; } ;;
          esac
          unzip -Z1 "$RUNNER_TEMP/artefact/${{ matrix.uploaded }}" > /dev/null

  github-release:
    name: GitHub Release
    needs: [manifest, dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MATRIX: ${{ needs.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: The asset set verify.assets names
        run: |
          ffi=$(for rid in $(bash tools/release/release-toml.sh rids); do echo "lingara-embed-ffi-$TAG-$rid.zip"; done | jq -R . | jq -sc .)
          want=$(echo "$MATRIX" | jq -c --argjson ffi "$ffi" '[.include[].uploaded | select(. != "")] + $ffi + ["checksums.txt"] | sort')
          echo "WANT=$want" >> "$GITHUB_ENV"
      # A published release is immutable, so a re-run never repairs one: it
      # accepts a finished release and refuses anything else by name.
      - id: existing
        name: An existing release is finished, or the job stops
        run: |
          if ! gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/state.json" 2>/dev/null; then
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if jq -e --argjson want "$WANT" '.isDraft == false and ([.assets[].name] | sort) == $want' "$RUNNER_TEMP/state.json" >/dev/null; then
            echo "✓ $TAG is already published with its assets"
            echo "published=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "✗ a release for $TAG exists in another state: $(jq -c '{isDraft, assets: [.assets[].name]}' "$RUNNER_TEMP/state.json")"
          exit 1
      - if: steps.existing.outputs.published == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: artefact-*
          merge-multiple: true
          path: assets
      # The body is the tagged commit's message body: in public, the
      # production note promotion wrote; in staging, the publish commit's.
      - if: steps.existing.outputs.published == 'false'
        name: Draft, upload, verify, publish
        run: |
          set -euo pipefail
          git cat-file commit "$GITHUB_SHA" | sed '1,/^$/d' | sed '1,/^$/d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "✗ the release notes for $TAG are empty"; exit 1; }
          (cd assets && sha256sum * > checksums.txt && cat checksums.txt)
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" assets/*
          gh release view "$TAG" --json isDraft,assets |
            jq -e --argjson want "$WANT" '.isDraft == true and ([.assets[] | select(.size > 0) | .name] | sort) == $want'
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi

  # ── Publish: public repository only, one job per registry (D6) ──────────
  #
  # Every job asks probe.sh whether its version exists and publishes only
  # what is absent, so re-running a partial release finishes it. Every job
  # ends by proving its install lines (D7), published this run or not.

  publish-crates:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'crates.io')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      # Cargo publishes the core first and waits for the index before the
      # plugin; a crate already published is dropped from the command.
      - id: probe
        run: |
          crates=""
          [ "$(sh tools/release/probe.sh core "$TAG")" = absent ] && crates="$crates -p lingara-embed"
          [ "$(sh tools/release/probe.sh bevy "$TAG")" = absent ] && crates="$crates -p bevy_lingara"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.crates != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.probe.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.98.1 publish --locked ${{ steps.probe.outputs.crates }}
      - run: |
          sh tools/release/prove-install.sh core "$TAG" --deadline 15m
          sh tools/release/prove-install.sh bevy "$TAG" --deadline 15m

  publish-npm:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'npm')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The current LTS, not the build floor: trusted publishing needs npm >=
      # 11.5.1, pinned to a major so a new npm never arrives unannounced
      # (clients 9.10.26l).
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: npm install -g 'npm@^11.5.1' && npm --version
      - id: probe
        run: echo "state=$(sh tools/release/probe.sh typescript "$TAG")" >> "$GITHUB_OUTPUT"
      # The Release's own asset: the bytes that passed conformance.
      - if: steps.probe.outputs.state == 'absent'
        run: |
          gh release download "$TAG" -p 'lingara-embed-typescript-*.tgz' -p checksums.txt -D "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum -c --ignore-missing checksums.txt
          npm publish --provenance --access public --tag next "lingara-embed-typescript-$TAG.tgz"
      - run: sh tools/release/prove-install.sh typescript "$TAG" --deadline 15m

  publish-nuget:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'nuget')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - id: probe
        run: |
          absent=""
          for id in dotnet dotnetserver; do
            [ "$(sh tools/release/probe.sh "$id" "$TAG")" = absent ] && absent="$absent $id"
          done
          echo "absent=$absent" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.absent != ''
        run: |
          gh release download "$TAG" -p 'lingara-embed-dotnet*.nupkg' -p checksums.txt -D "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release" && sha256sum -c --ignore-missing checksums.txt
      - if: steps.probe.outputs.absent != ''
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      # The flat container lags a push by minutes, so a quick re-run can probe
      # `absent` for a package already pushed; --skip-duplicate turns that
      # 409 into a skip.
      - if: steps.probe.outputs.absent != ''
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for id in ${{ steps.probe.outputs.absent }}; do
            dotnet nuget push "$RUNNER_TEMP/release/lingara-embed-$id-$TAG.nupkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - run: |
          sh tools/release/prove-install.sh dotnet "$TAG" --deadline 30m
          sh tools/release/prove-install.sh dotnetserver "$TAG" --deadline 30m

  publish-rubygems:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'rubygems')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - id: probe
        run: echo "state=$(sh tools/release/probe.sh ruby "$TAG")" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.state == 'absent'
        working-directory: ruby
        run: gem build lingara-embed.gemspec
      - if: steps.probe.outputs.state == 'absent'
        uses: rubygems/configure-rubygems-credentials@main
      - if: steps.probe.outputs.state == 'absent'
        run: gem push "ruby/lingara-embed-$(release-manifest gem-version "${TAG#v}").gem"
      - run: sh tools/release/prove-install.sh ruby "$TAG" --deadline 15m

  publish-maven:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'maven-central')
    runs-on: ubuntu-latest
    environment: release
    # Above the sum of the six proofs' deadlines, 60m each in the worst case.
    timeout-minutes: 380
    env:
      MATRIX: ${{ needs.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The four JVM rids' bytes, at dist/jvm/<rid>/, the paths kept, so the
      # natives jar and AAR hold what D3 checked.
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-{win-x64,osx,linux-x64,android-arm64}
          merge-multiple: true
          path: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: The natives jar and AAR again, since this job rebuilds them
        run: |
          make release-pack ID=nativesdesktop
          make release-pack ID=nativesandroid
      # Signs and uploads only the coordinates whose probe is 404. Central
      # rejects a duplicate version, so a probe that races its propagation
      # fails loudly and never publishes twice.
      - name: Sign and upload to the Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          for row in $(echo "$MATRIX" | jq -r '.include[] | select(.registry == "maven-central") | "\(.id):\(.dir)"'); do
            id=${row%%:*}; project=${row#*:}
            if [ "$(sh tools/release/probe.sh "$id" "$TAG")" = absent ]; then
              ./gradlew ":$project:publishAndReleaseToMavenCentral"
            fi
          done
      - name: Prove the install lines
        run: |
          for id in $(echo "$MATRIX" | jq -r '.include[] | select(.registry == "maven-central") | .id'); do
            sh tools/release/prove-install.sh "$id" "$TAG" --deadline 60m
          done

  publish-go:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'go')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      MATRIX: ${{ needs.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # Nothing to upload: the go/<tag> tag promotion pushed is the release.
      # Asking the proxy for it makes the proxy fetch and cache the module.
      - name: Warm the proxy
        run: |
          module=$(echo "$MATRIX" | jq -r '.include[] | select(.id == "go") | .package')
          GOPROXY=https://proxy.golang.org go list -m "$module@$TAG"
      - run: sh tools/release/prove-install.sh go "$TAG" --deadline 15m

  publish-packagist:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'packagist')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      MIRROR: git@github.com:Spinning-Cat-Studios/lingara-embed-php.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      # Packagist reads composer.json from a repository root only, so php/ is
      # split onto the mirror and tagged there. The push is a fast-forward,
      # except that R1's one-commit placeholder is replaced once, under a
      # lease on its exact sha.
      - name: Split php/ onto the mirror and tag it
        run: |
          if git ls-remote --exit-code --tags "$MIRROR" "refs/tags/$TAG" >/dev/null; then
            echo "✓ the mirror already has $TAG"; exit 0
          fi
          split=$(git subtree split --prefix=php HEAD)
          git fetch "$MIRROR" main
          current=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$current" "$split"; then
            git push "$MIRROR" "$split:refs/heads/main"
          elif [ "$(git rev-list --count "$current")" = 1 ]; then
            git push --force-with-lease="main:$current" "$MIRROR" "$split:refs/heads/main"
          else
            echo "✗ the mirror's main ($current) is not an ancestor of the split ($split); refusing a non-fast-forward"
            exit 1
          fi
          git push "$MIRROR" "$split:refs/tags/$TAG"
      - run: sh tools/release/prove-install.sh php "$TAG" --deadline 15m

  # ── Stores: no publish API, so a person's exact checklist (D6, W4) ──────

  publish-godot-assetlib:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'godot-assetlib')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The Asset Library edit form's values (Manual step 7)
        run: |
          asset="lingara-embed-godot-$TAG.zip"
          url=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$asset\") | .url")
          [ -n "$url" ] || { echo "✗ the Release holds no $asset"; exit 1; }
          floor=$(sed -n 's/^| Godot version | \([0-9.]*\).*/\1/p' godot/addon/ASSETLIB.md)
          pre=""; [[ "$TAG" == *-* ]] && pre=" (pre-release)"
          {
            echo "## Godot Asset Library: submit this edit by hand"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version string | ${TAG#v}$pre |"
            echo "| Godot version | $floor |"
            echo "| Repository host | Custom |"
            echo "| Download URL | $url |"
            echo
            echo "### Listing text (godot/addon/ASSETLIB.md)"
            echo
            cat godot/addon/ASSETLIB.md
          } >> "$GITHUB_STEP_SUMMARY"

  # Fab: nothing before 1.0.0 (K5 D9), and nothing until the unreal entry
  # joins languages.toml (D1), which this job's `if:` reads.
  publish-fab:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_embeddable_sdk' && contains(fromJSON(needs.manifest.outputs.registries), 'fab') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Each per-engine zip and its hash (Manual step 8)
        run: |
          asset="lingara-embed-unreal-$TAG.zip"
          gh release download "$TAG" -p "$asset" -D "$RUNNER_TEMP/fab"
          cd "$RUNNER_TEMP/fab" && unzip -q "$asset"
          {
            echo "## Fab: submit each zip by hand, once K5's unreal-smoke lane has passed for its engine version"
            echo
            echo "| Zip | sha256 |"
            echo "|---|---|"
            for zip in LingaraEmbed-*.zip; do echo "| $zip | $(sha256sum "$zip" | cut -d' ' -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
