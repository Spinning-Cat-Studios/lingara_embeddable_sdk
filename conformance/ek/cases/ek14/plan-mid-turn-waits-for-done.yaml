id: ek14.plan-mid-turn-waits-for-done
behaviours: [EK14]
tier: ek
# A plan never moves a streaming turn (ADR 3.11.26j D3): restored from a
# saved frontier on the exhausted Practise beat `p1_2`, the run asks one
# `exhausted` plan at load, and the slow answer lands while a slow turn
# streams. The turn sends the frontier as it was, and the answer is applied
# only after `done`: `finished` comes before `dialogue_planned`.
serve:
  - route: { operation: planDialogue }
    expect_request:
      body: { reason: exhausted, current: p1_2, id_prefix: p2 }
    respond:
      fault: { delay_ms: 600 }
      json: { status: planned, fragment: { anchor: p1_2, beats: [{ id: p1_2, atom: practise, depth: 0, topic: tea, goal: paid_up, exits: [{ to: p2_1 }] }, { id: p2_1, atom: close, depth: 1, ending: sold }] } }
  - route: { operation: sendDialogueTurn }
    expect_request:
      body: { checkpoint: { id: p1_2 } }
    respond:
      fault: { delay_fragment_ms: 300 }
      sse:
        - { event: delta, data: { text: 多少 } }
        - { event: delta, data: { text: 钱 } }
        - { event: done, data: {} }
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command:
      type: dialogue_load
      source:
        type: ir
        ir_json: '{"schema":"dialogue.v2","kind":"procedural","id":"ek14_tea","pedagogy":"none","endings":[{"id":"sold"},{"id":"walked_off"}],"npcs":[{"id":"keeper","name":"Mei","persona":"a tea seller","disposition":{"suggestibility":0.5,"initiative":0.95}},{"id":"boy","name":"Bo"}],"facts":[{"key":"paid","type":"boolean","default":false},{"key":"warm","type":"boolean","default":false},{"key":"lanterns","type":"number","default":3}],"procedural":{"premise":"The player wants a cup of tea","topics":[{"id":"tea","about":"the tea on offer"},{"id":"night","about":"the night market","when":"warm"},{"id":"errands","about":"the errands of the boy","npcs":["boy"]}],"goals":[{"id":"paid_up","describe":"the tea is paid for","predicate":"paid","when":"The player pays."}],"atoms":[{"atom":"open"},{"atom":"elicit"},{"atom":"practise"},{"atom":"close"}],"horizon":{"plan_depth":2,"sketch_depth":1,"max_nodes":8},"termination":{"max_turns":20,"max_beats":6,"success":{"goal":"paid_up","ending":"sold"},"stall":{"turns":2,"ending":"walked_off"},"on_limit":"walked_off"}}}'
      session:
        npc: keeper
        source_lang: en
        target_lang: zh
        level: 2
        checkpoint: p1_2
        frontier: '{"anchor":"p1_0","beats":[{"id":"p1_0","atom":"open","depth":0,"exits":[{"to":"p1_1"}]},{"id":"p1_1","atom":"elicit","depth":1,"topic":"tea","exits":[{"to":"p1_2"}]},{"id":"p1_2","atom":"practise","depth":2,"topic":"tea","goal":"paid_up","exits":[{"to":"p1_3"}]},{"id":"p1_3","atom":"close","depth":3,"sketch":true,"ending":"sold"}]}'
  - poll_until: { event: checkpoint_reached, match: { checkpoint: p1_2, via: start }, within_ms: 3000 }
  - stop_polling: { for_ms: 200 }
  - command: { type: dialogue_say, dialogue: $last, line: 多少钱 }
  - poll_until: { event: npc_turn, match: { update: { type: finished } }, within_ms: 3000 }
  - poll_until: { event: dialogue_planned, match: { outcome: accepted, checkpoints: [p1_2, p1_2_again, p2_1] }, within_ms: 3000 }
  - close: {}
expect:
  requests: { count: 2 }
