id: ek14.turn-carries-the-stance
behaviours: [EK14]
tier: ek
# A procedural turn is a static turn plus the stance (ADR 3.11.26j D7): the
# keeper's `disposition` as written, and, because she is Railroad
# (initiative 0.95), the expansion's `steer_to` edge's `when` as `steer`.
serve:
  - route: { operation: planDialogue }
    respond:
      json: { status: planned, fragment: { anchor: p1_0, beats: [{ id: p1_0, atom: open, depth: 0, exits: [{ to: p1_1 }] }, { id: p1_1, atom: elicit, depth: 1, topic: tea, exits: [{ to: p1_2 }] }, { id: p1_2, atom: practise, depth: 2, topic: tea, goal: paid_up, exits: [{ to: p1_3 }] }, { id: p1_3, atom: close, depth: 3, sketch: true, ending: sold }] } }
  - route: { operation: sendDialogueTurn }
    expect_request:
      body:
        npc: { name: Mei, disposition: { suggestibility: 0.5, initiative: 0.95 } }
        checkpoint: { id: p1_0, steer: The player has greeted the character or said why they are here. }
        edges: [{ id: p1_0_x0, to: p1_1, when: The player has greeted the character or said why they are here. }]
    respond: { sse: [{ event: delta, data: { text: 你好 } }, { event: done, data: {} }] }
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command:
      type: dialogue_load
      source:
        type: ir
        ir_json: '{"schema":"dialogue.v2","kind":"procedural","id":"ek14_tea","pedagogy":"none","endings":[{"id":"sold"},{"id":"walked_off"}],"npcs":[{"id":"keeper","name":"Mei","persona":"a tea seller","disposition":{"suggestibility":0.5,"initiative":0.95}},{"id":"boy","name":"Bo"}],"facts":[{"key":"paid","type":"boolean","default":false},{"key":"warm","type":"boolean","default":false},{"key":"lanterns","type":"number","default":3}],"procedural":{"premise":"The player wants a cup of tea","topics":[{"id":"tea","about":"the tea on offer"},{"id":"night","about":"the night market","when":"warm"},{"id":"errands","about":"the errands of the boy","npcs":["boy"]}],"goals":[{"id":"paid_up","describe":"the tea is paid for","predicate":"paid","when":"The player pays."}],"atoms":[{"atom":"open"},{"atom":"elicit"},{"atom":"practise"},{"atom":"close"}],"horizon":{"plan_depth":2,"sketch_depth":1,"max_nodes":8},"termination":{"max_turns":20,"max_beats":6,"success":{"goal":"paid_up","ending":"sold"},"stall":{"turns":2,"ending":"walked_off"},"on_limit":"walked_off"}}}'
      session: { npc: keeper, source_lang: en, target_lang: zh, level: 2 }
  - poll_until: { event: checkpoint_reached, match: { checkpoint: p1_0, via: start }, within_ms: 3000 }
  - command: { type: dialogue_say, dialogue: $last, line: 你好 }
  - poll_until: { event: npc_turn, match: { update: { type: finished } }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 2 }
