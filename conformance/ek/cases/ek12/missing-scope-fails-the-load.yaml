id: ek12.missing-scope-fails-the-load
behaviours: [EK12]
tier: ek
# A token minted without dialogues:read.
serve:
  - route: { operation: exportDialogue }
    respond: { status: 403, json: { code: insufficient_scope, error: the token lacks dialogues:read } }
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command:
      type: dialogue_load
      source: { type: stored, dialogue_id: 3f2a9c1e-7b4d-4e8a-9c0f-1a2b3c4d5e6f }
      session: { npc: old_wei, source_lang: en, target_lang: zh, level: 2 }
  - poll_until: { event: dialogue_load_failed, match: { error: { kind: forbidden, code: insufficient_scope, retryable: false } }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 1 }
