id: ek12.unknown-id-fails-the-load
behaviours: [EK12]
tier: ek
# An unknown id, another integrator's, and the flag dark all answer this.
serve:
  - route: { operation: exportDialogue }
    respond: { status: 404, json: { code: not_found, error: no such dialogue } }
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command:
      type: dialogue_load
      source: { type: stored, dialogue_id: 3f2a9c1e-7b4d-4e8a-9c0f-1a2b3c4d5e6f }
      session: { npc: old_wei, source_lang: en, target_lang: zh, level: 2 }
  - poll_until: { event: dialogue_load_failed, match: { error: { kind: not_found, code: not_found, retryable: false } }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 1 }
