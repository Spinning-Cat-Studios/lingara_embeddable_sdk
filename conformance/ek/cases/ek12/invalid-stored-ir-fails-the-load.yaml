id: ek12.invalid-stored-ir-fails-the-load
behaviours: [EK12]
tier: ek
# The worked example with `thanks` pointed at a checkpoint that does not
# exist: a contract fault the IR's validation refuses.
serve:
  - route: { operation: exportDialogue }
    respond:
      status: 200
      headers: { lingara-dialogue-revision: "4", etag: '"sha256-broken"' }
      json: {"schema": "dialogue.v1", "id": "night_market_keepers", "title": "The two keepers", "pedagogy": "none", "npcs": [{"id": "old_wei", "name": "Old Wei", "persona": "a retired ferryman who distrusts strangers", "languages": [{"code": "zh", "speaking": 9, "comprehension": 9}]}], "facts": [{"key": "trust", "type": "number", "default": 0}, {"key": "eastern_gate", "type": "string"}], "start": "suspicious_of_player", "checkpoints": [{"id": "suspicious_of_player", "goal": "Size the stranger up; warm to them only if they explain why they are here", "may_disclose": [], "edges": [{"id": "asks_about_brother", "to": "reveal_gate", "predicate": "trust >= 0.4", "when": "the player has asked about their missing brother"}, {"id": "turns_hostile", "to": "failure", "when": "the player threatens or insults Old Wei"}]}, {"id": "reveal_gate", "goal": "Tell the player the eastern gate is guarded, reluctantly", "may_disclose": ["eastern_gate"], "edges": [{"id": "thanks", "to": "nowhere", "when": "the player thanks Old Wei or says goodbye"}]}], "x-layout": {"checkpoints": {"suspicious_of_player": {"x": 0, "y": 0}, "reveal_gate": {"x": 240, "y": 0}}, "outcomes": {"success": {"x": 480, "y": 0}, "failure": {"x": 240, "y": 160}}}}
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command:
      type: dialogue_load
      source: { type: stored, dialogue_id: 3f2a9c1e-7b4d-4e8a-9c0f-1a2b3c4d5e6f }
      session: { npc: old_wei, source_lang: en, target_lang: zh, level: 2 }
  - poll_until: { event: dialogue_load_failed, match: { error: { kind: invalid_input, retryable: false } }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 1 }
