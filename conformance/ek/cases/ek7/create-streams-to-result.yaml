id: ek7.create-streams-to-result
behaviours: [EK7]
tier: ek
# `result` carries the whole plan: no plan read follows.
serve:
  - route: { operation: createLessonPlan }
    expect_request: { body: { context: a tea house, source_lang: en, target_lang: zh, level: 2 } }
    respond:
      sse:
        - { event: started, data: { plan_id: 8f0e2c1a-0000-4000-8000-000000000001 } }
        - event: result
          data:
            plan:
              id: 8f0e2c1a-0000-4000-8000-000000000001
              status: complete
              level: 2
              source_lang: en
              target_lang: zh
              ai_generated: true
              created_at: "2026-10-01T12:00:00Z"
              content:
                learning_objectives: []
                vocabulary: []
                sets: [{ number: 1, questions: [{ type: translation, prompt: tea, answer: cha, explanation: tea }] }]
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command: { type: practice_start, source: { type: create, context: a tea house, source_lang: en, target_lang: zh, level: 2 } }
  - poll_until: { event: practice, match: { snapshot: { phase: unanswered } }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 1 }
