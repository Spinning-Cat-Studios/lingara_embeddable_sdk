id: ek8.503-maintenance
behaviours: [EK8]
tier: ek
# A 503 whose body is not JSON is maintenance.
serve:
  - route: { operation: sendEvent }
    respond: { status: 503 }
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command: { type: send_context, context: { scene: the night market, source_lang: en, target_lang: zh, level: 2 } }
  - poll_until: { event: error, match: { error: { kind: unavailable, retryable: true, status: 503 } }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 1 }
