id: ek8.403-insufficient-scope
behaviours: [EK8]
tier: ek
serve:
  - route: { operation: sendEvent }
    respond: { status: 403, json: { code: insufficient_scope, error: the token lacks events:write } }
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command: { type: send_context, context: { scene: the night market, source_lang: en, target_lang: zh, level: 2 } }
  - poll_until: { event: error, match: { error: { kind: forbidden, retryable: false, status: 403, code: insufficient_scope } }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 1 }
