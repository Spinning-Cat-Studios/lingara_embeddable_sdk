id: ek11.named-ending-ends-the-dialogue
behaviours: [EK11]
tier: ek
# A dialogue.v2 graph with named endings (ADR 3.11.26g §11): resumed at
# `ask`, the judge crosses `gate` to the declared ending `found`, and the
# story ends on that ending's id, naming the checkpoint it left.
serve:
  - route: { operation: sendDialogueTurn }
    expect_request:
      body: { checkpoint: { id: ask } }
    respond:
      sse:
        - { event: delta, data: { text: Por la puerta del este } }
        - { event: transition, data: { edge: gate, to: found } }
        - { event: done, data: {} }
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command:
      type: dialogue_load
      source:
        type: ir
        ir_json: '{"schema":"dialogue.v2","kind":"static","id":"ek11_named","endings":[{"id":"found","label":"Found the brother"},{"id":"fled"}],"npcs":[{"id":"elena","name":"Elena"}],"start":"intro","checkpoints":[{"id":"intro","goal":"Elena is wary","edges":[{"id":"hello","to":"ask","when":"the player greets her"},{"id":"threat","to":"fled","when":"the player threatens her"}]},{"id":"ask","goal":"Admit she saw soldiers","edges":[{"id":"gate","to":"found","when":"the player asks where"}]}]}'
      session: { source_lang: en, target_lang: es, level: 2, checkpoint: ask }
  - poll_until: { event: checkpoint_reached, match: { checkpoint: ask, via: start }, within_ms: 2000 }
  - command: { type: dialogue_say, dialogue: $last, line: donde }
  - poll_until: { event: npc_turn, match: { update: { type: finished } }, within_ms: 2000 }
  - poll_until: { event: dialogue_ended, match: { outcome: found, checkpoint: ask, edge: gate }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 1 }
