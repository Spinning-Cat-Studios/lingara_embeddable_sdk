id: ek11.only-disclosable-facts-are-sent
behaviours: [EK11]
tier: ek
# `gate` is set, `mood` has a default, `note`'s default is blank and so is no
# value, and `secret` is not in `may_disclose`: only gate and mood leave the
# device. The checkpoint has no edges, so the turn sends none.
serve:
  - route: { operation: sendDialogueTurn }
    expect_request:
      body_equals:
        npc: { name: Elena }
        source_lang: en
        target_lang: es
        level: 2
        line: hola
        pedagogy: subtle
        checkpoint: { id: intro, goal: Elena is wary, may_disclose: [gate, mood, note] }
        facts: { gate: the eastern gate, mood: calm }
    respond: { sse: [{ event: delta, data: { text: Hola } }, { event: done, data: {} }] }
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command:
      type: dialogue_load
      source:
        type: ir
        ir_json: '{"schema":"dialogue.v1","id":"ek11","npcs":[{"id":"elena","name":"Elena"}],"facts":[{"key":"gate","type":"string"},{"key":"mood","type":"string","default":"calm"},{"key":"note","type":"string","default":"  "},{"key":"secret","type":"string","default":"kept"}],"start":"intro","checkpoints":[{"id":"intro","goal":"Elena is wary","may_disclose":["gate","mood","note"]}]}'
      session: { source_lang: en, target_lang: es, level: 2 }
  - poll_until: { event: checkpoint_reached, match: { checkpoint: intro, via: start }, within_ms: 2000 }
  - command: { type: dialogue_set_fact, dialogue: $last, key: gate, value: the eastern gate }
  - command: { type: dialogue_set_fact, dialogue: $last, key: secret, value: never sent }
  - command: { type: dialogue_say, dialogue: $last, line: hola }
  - poll_until: { event: npc_turn, match: { update: { type: finished, text: Hola } }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 1 }
