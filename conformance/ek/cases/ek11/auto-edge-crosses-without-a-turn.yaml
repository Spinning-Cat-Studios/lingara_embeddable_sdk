id: ek11.auto-edge-crosses-without-a-turn
behaviours: [EK11]
tier: ek
# Edges with no `when` are the core's alone: a fact that opens one crosses it
# with no request, and the crossing continues from where it lands, here to
# an outcome.
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command:
      type: dialogue_load
      source:
        type: ir
        ir_json: '{"schema":"dialogue.v1","id":"ek11","npcs":[{"id":"elena","name":"Elena"}],"facts":[{"key":"ready","type":"boolean","default":false}],"start":"intro","checkpoints":[{"id":"intro","goal":"Elena is wary","edges":[{"id":"go","to":"hall","predicate":"ready"},{"id":"hello","to":"hall","when":"the player greets her"}]},{"id":"hall","goal":"Walk on","edges":[{"id":"leave","to":"success","predicate":"ready"}]}]}'
      session: { source_lang: en, target_lang: es, level: 2 }
  - poll_until: { event: checkpoint_reached, match: { checkpoint: intro, via: start }, within_ms: 2000 }
  - command: { type: dialogue_set_fact, dialogue: $last, key: ready, value: true }
  - poll_until: { event: checkpoint_reached, match: { checkpoint: hall, edge: go, via: auto }, within_ms: 2000 }
  - poll_until: { event: dialogue_ended, match: { outcome: success, checkpoint: hall, edge: leave }, within_ms: 2000 }
  - close: {}
expect:
  requests: { count: 0 }
