id: ek5.demo-plan-sends-nothing
behaviours: [EK5]
tier: ek
# A demo plan is started with report: false: finishing it sends nothing.
serve:
  - route: { operation: getLessonPlan }
    respond:
      json:
        id: 8f0e2c1a-0000-4000-8000-0000000000de
        status: complete
        level: 1
        source_lang: en
        target_lang: zh
        ai_generated: false
        created_at: "2026-10-01T12:00:00Z"
        content:
          learning_objectives: []
          vocabulary: []
          sets: [{ number: 1, questions: [{ type: translation, prompt: hello, answer: ni hao, explanation: a greeting }] }]
host:
  - start: { initial_token: lgr_et_conformance0001, config: { stream_on_start: false } }
  - command: { type: practice_start, source: { type: plan, plan_id: 8f0e2c1a-0000-4000-8000-0000000000de, report: false } }
  - poll_until: { event: practice, match: { snapshot: { phase: unanswered } }, within_ms: 2000 }
  - command: { type: practice_finish, session: $last }
  - expect_no_event: { event: practice, for_ms: 500 }
  - close: {}
expect:
  requests: { count: 1 }
