id: es1.failed-mint-remembers-nothing
behaviours: [ES1]
tier: es
directory: { seed: { lgr_sub_conformance_p0: p0 } }
serve:
  - route: { token_grant: {} }
    respond: { json: { access_token: "lgr_at_conformance0001", token_type: "Bearer", expires_in: 3600, scope: "embed:mint" } }
  - route: { operation: createEmbedToken }
    respond: { status: 403, json: { code: embed_needs_metered, error: "Only a metered client may mint embed tokens." } }
kit:
  - mint: { player_ref: p1 }
expect:
  error: { status: 403, code: embed_needs_metered }
  directory: { lgr_sub_conformance_p0: p0 }
  requests: { count: 2 }
