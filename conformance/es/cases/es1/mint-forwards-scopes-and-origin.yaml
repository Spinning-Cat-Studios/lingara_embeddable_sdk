id: es1.mint-forwards-scopes-and-origin
behaviours: [ES1]
tier: es
serve:
  - route: { token_grant: {} }
    respond: { json: { access_token: "lgr_at_conformance0001", token_type: "Bearer", expires_in: 3600, scope: "embed:mint" } }
  - route: { operation: createEmbedToken }
    expect_request: { body_equals: { player_ref: p1, scopes: [events:read, embed:play], origin: "https://game.example" } }
    respond:
      headers: { cache-control: no-store }
      json: { token: "lgr_et_Ab3dEf6hIj9lMn2pQr5tUv8xYz1bCd4fGh7jKl0nPq3", expires_at: "2026-10-01T09:27:44Z", expires_in: 900, subject: "lgr_sub_conformance_p1", scopes: [events:read, embed:play], account_linked: false }
kit:
  - mint: { player_ref: p1, scopes: [events:read, embed:play], origin: "https://game.example" }
expect:
  minted: { token: "lgr_et_Ab3dEf6hIj9lMn2pQr5tUv8xYz1bCd4fGh7jKl0nPq3", expires_at: "2026-10-01T09:27:44Z", expires_in: 900, subject: lgr_sub_conformance_p1, scopes: [events:read, embed:play], account_linked: false }
  requests: { count: 2 }
