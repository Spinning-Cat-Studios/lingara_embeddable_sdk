id: es7.insufficient-scope-raised
behaviours: [ES7]
tier: es
serve:
  - route: { token_grant: {} }
    respond: { json: { access_token: "lgr_at_conformance0001", token_type: "Bearer", expires_in: 3600, scope: "embed:mint" } }
  - route: { operation: createEmbedToken }
    respond: { status: 403, json: { code: insufficient_scope, error: "This call needs the embed:mint scope." } }
kit:
  - mint: { player_ref: p1 }
expect:
  error: { status: 403, code: insufficient_scope }
  requests: { count: 2 }
