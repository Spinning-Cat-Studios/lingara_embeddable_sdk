id: es6.handoff-carries-update-available
behaviours: [ES6]
tier: es
serve:
  - route: { token_grant: {} }
    respond: { json: { access_token: "lgr_at_conformance0001", token_type: "Bearer", expires_in: 3600, scope: "embed:mint" } }
  - route: { operation: createEmbedToken }
    expect_request: { body_equals: { player_ref: p1, embed_version: "1.1.0" } }
    respond:
      headers: { cache-control: no-store }
      json: { token: "lgr_et_Ab3dEf6hIj9lMn2pQr5tUv8xYz1bCd4fGh7jKl0nPq3", expires_at: "2026-10-01T09:27:44Z", expires_in: 900, subject: "lgr_sub_conformance_p1", scopes: [events:read, events:write, embed:play], account_linked: false, update_available: { deprecated: true, message: "Use 1.2.0 — see https://example.com/changelog", latest: "1.2.0" } }
kit:
  - mint: { player_ref: p1, headers: { Lingara-Embed-Version: "1.1.0" } }
  - handoff: {}
expect:
  handoff: '{"token":"lgr_et_Ab3dEf6hIj9lMn2pQr5tUv8xYz1bCd4fGh7jKl0nPq3","expires_at":"2026-10-01T09:27:44Z","update_available":{"latest":"1.2.0","deprecated":true,"message":"Use 1.2.0 — see https://example.com/changelog"}}'
  requests: { count: 2 }
