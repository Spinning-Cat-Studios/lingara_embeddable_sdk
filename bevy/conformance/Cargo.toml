[package]
name = "bevy-lingara-ek-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "The EK conformance harness through bevy_lingara: every EK case's host script, driven through the plugin's Messages and components"

[[bin]]
name = "bevy-lingara-ek-harness"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20", default-features = false }
bevy_lingara = { path = ".." }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde_json = "1"
