[package]
name = "bevy_lingara_demo"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "The Bevy demo (ADR 1.10.26z D10): two NPCs at two levels, and a practice session, over bevy_lingara"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bevy-lingara-demo"
path = "src/main.rs"

# Bevy with its default features: the demo draws (D10). The plugin itself
# never does.
[dependencies]
bevy = "0.20"
bevy_lingara = { path = ".." }

[dev-dependencies]
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
