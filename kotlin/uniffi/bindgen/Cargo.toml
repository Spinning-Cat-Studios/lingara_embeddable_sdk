[package]
name = "lingara-embed-uniffi-bindgen"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "The bindgen that writes kotlin/'s committed bindings from the host library (ADR 1.10.26ae D2)."
publish = false

# Its own package, as the Lingara apps' own bindgen is:
# `clap`, pulled in by the `cli` feature, stays out of every cross-compile of
# the wrapper, and a regen does not build the library twice. Both crates sit
# in one workspace, so one Cargo.lock holds them at the same UniFFI.
[[bin]]
name = "lingara-embed-uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.31.1", features = ["cli"] }
