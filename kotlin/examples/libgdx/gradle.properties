# As the repo root's (ADR 1.10.26ae D10): AGP 9's built-in Kotlin cannot
# drive the catalogue's Kotlin Gradle plugin, which core and lwjgl3 load. The
# android module's one source file is Java, so it needs no Kotlin compiler.
android.builtInKotlin=false

# AGP, the Kotlin Gradle plugin and the composite root build in one daemon
# outgrow Gradle's default 384 MB metaspace.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
