# Every JVM pin, once (ADR 1.10.26af D13, after the app kits' 30.9.26am D8).
# The pins are the client libraries' own, so a kit and its library are built
# alike. K7 (1.10.26ae) adds its own entries beside these.

[versions]
# The library each server kit depends on. It is also LIBRARY_FLOOR, which
# tools/library-floor/check.sh holds equal to the literal in java-server/ and
# kotlin-server/ build files; this entry is for the snippet and conformance
# projects.
lingara = "0.2.0-alpha.1"
junit = "5.14.4"
spotless = "8.10.3"
google-java-format = "1.28.0"
checkstyle = "10.26.1"
# Maven Central publishing through the Central Portal API.
maven-publish = "0.37.0"
# Kotlin. The Kotlin Gradle plugin pins the compiler.
kotlin = "2.4.10"
# The kotlin-stdlib the published POM declares: the apiVersion's, not the
# compiler's, so a caller's Kotlin 2.2 compiler can read it.
kotlin-stdlib-floor = "2.2.0"
ktlint = "1.7.1"
# Ktor 3 on CIO: the Kotlin ES harness's receiver and the Kotlin snippets'
# server, never a kit dependency.
ktor = "3.6.0"
# K7 (ADR 1.10.26ae), Step 1's pins as read on 2026-10-10. JNA is
# Generator's own pin and Central's newest; AGP 9.4 supports this Gradle and
# compiles Kotlin itself, so no Android module applies kotlin-android.
jna = "5.19.1"
agp = "9.4.1"
gdx = "1.14.2"
# The EK harnesses' case parsers, conformance only: never in a published POM.
kotlinx-serialization = "1.11.0"
jackson = "2.22.3"

[libraries]
lingara-java = { module = "com.getlingara:lingara-java", version.ref = "lingara" }
lingara-kotlin = { module = "com.getlingara:lingara-kotlin", version.ref = "lingara" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-backend-android = { module = "com.badlogicgames.gdx:gdx-backend-android", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }

[plugins]
# The libGDX example's own build (kotlin/examples/libgdx) loads these.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
