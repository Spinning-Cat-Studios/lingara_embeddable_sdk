[package]
name = "lingara-embed-ffi"
# The trio's one VERSION (roadmap D10); the release tooling writes it here as
# it does core/Cargo.toml.
version = "0.1.0-alpha.8"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "The C ABI over lingara-embed: nine functions moving K1's JSON through caller-owned buffers (ADR 1.10.26aa)."
repository = "https://github.com/Spinning-Cat-Studios/lingara_embeddable_sdk"
# Native libraries reach users inside the nupkg, the Unreal plugin and a
# release asset, never through crates.io (D1).
publish = false

[lib]
name = "lingara_embed"
crate-type = ["cdylib", "staticlib"]

# Renamed `core_embed`: this crate's own library is also `lingara_embed`.
[dependencies]
core_embed = { package = "lingara-embed", path = "../core", version = "=0.1.0-alpha.8" }
serde = "1"
serde_json = "1"

# The header and the schema are generated by tests, so the shipped libraries
# carry no schema code (D1, D12).
[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }
core_embed = { package = "lingara-embed", path = "../core", version = "=0.1.0-alpha.8", features = ["schema"] }
schemars = "1"
