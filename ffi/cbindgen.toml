# cbindgen's view of lingara-embed-ffi (ADR 1.10.26aa D3, D5). The header it
# writes is committed as include/lingara_embed.h; header_tests.rs fails when
# the two differ, and `make ffi-header` rewrites it.
language = "C"
include_guard = "LINGARA_EMBED_H"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
autogen_warning = "/* Generated by cbindgen from ffi/src (make ffi-header). Do not edit. */"
documentation_style = "c"
usize_is_size_t = true
style = "type"

[export]
# The status codes and ABI numbers are `pub const`s, emitted as #defines.
include = ["LingaraEmbed"]

[parse]
parse_deps = false

[fn]
# An int32_t status, never a C enum: an enum's size is the compiler's choice.
args = "Horizontal"
