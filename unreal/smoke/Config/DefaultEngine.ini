; The smoke project's engine config (ADR 1.10.26ac D8). The cleartext keys
; below let a device reach tools/demo-token-server over plain HTTP during the
; smoke. They live here, in the smoke project, and never in the plugin: a
; shipping game fetches its token over HTTPS. The first smoke confirms them
; on the oldest supported engine version.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/LingaraEmbed/Samples/L_LingaraSample.L_LingaraSample
EditorStartupMap=/LingaraEmbed/Samples/L_LingaraSample.L_LingaraSample

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
bAllowNetworkConnectivityToUseCleartextTraffic=True
MinSDKVersion=26

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
AdditionalPlistData=<key>NSAppTransportSecurity</key><dict><key>NSAllowsLocalNetworking</key><true/><key>NSAllowsArbitraryLoads</key><true/></dict><key>NSLocalNetworkUsageDescription</key><string>The smoke reaches the token server on this Mac.</string>
